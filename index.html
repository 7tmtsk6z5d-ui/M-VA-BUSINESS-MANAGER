<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="MŌVA — kasir, keuangan, stok, laporan, dan kontrol bisnis dalam satu tempat.">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <title>MŌVA — Business Manager</title>
</head>
<body>
  <div id="backgroundLayer" aria-hidden="true"></div>
  <div id="app">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="brand-mark">
          <div class="brand-logo"><img src="./logo-mark.svg" alt="MŌVA"></div>
          <div class="brand-text"><strong>MŌVA</strong><small>KASIR · KEUANGAN · STOK</small></div>
        </div>
        <div class="header-actions">
          <span id="connectionBadge" class="mova-status-badge" data-status="loading">Menghubungkan…</span>
          <button type="button" class="icon-button" id="headerAccountButton" aria-label="Akun">◎</button>
        </div>
      </div>
    </header>

    <main class="app-main" id="pageRoot" aria-live="polite"></main>

    <nav class="bottom-navigation" aria-label="Navigasi utama">
      <div class="bottom-navigation-inner">
        <button type="button" class="nav-button active" data-page="home" aria-current="page"><span class="nav-icon">⌂</span><span class="nav-label">Home</span></button>
        <button type="button" class="nav-button" data-page="kasir"><span class="nav-icon">＋</span><span class="nav-label">Kasir</span></button>
        <button type="button" class="nav-button" data-page="produk"><span class="nav-icon">□</span><span class="nav-label">Produk</span></button>
        <button type="button" class="nav-button" data-page="finance"><span class="nav-icon">Rp</span><span class="nav-label">Finance</span></button>
        <button type="button" class="nav-button" data-page="more"><span class="nav-icon">⋯</span><span class="nav-label">More</span></button>
      </div>
    </nav>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <div id="modalRoot"></div>
  </div>
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
